name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build tools
        run: pip install build

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build package
        run: python -m build

      - name: Verify the wheel ships the web UI
        run: |
          pip install --no-deps --target /tmp/rw-wheel-check dist/*.whl
          test -f /tmp/rw-wheel-check/repowiki/server/static/index.html
          python - <<'PY'
          import glob, zipfile
          from collections import Counter
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          dupes = [n for n, c in Counter(names).items() if c > 1]
          assert not dupes, f"duplicate wheel entries: {dupes[:5]}"
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
